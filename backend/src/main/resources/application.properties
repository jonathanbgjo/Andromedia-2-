spring.application.name=andromedia
spring.datasource.url=jdbc:postgresql://localhost:5432/andromedia
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}
# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
# Keep SQL logging off by default; enable per-environment when debugging.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

aws.accessKey=${AWS_ACCESS_KEY}
aws.secretKey=${AWS_SECRET_KEY}
aws.region=us-east-1
aws.s3.bucket-name=andromedia-videos
 
# JWT signing secret — REQUIRED, no default. Must be >= 32 bytes. Set JWT_SECRET
# in the environment (generate one with: openssl rand -base64 48).
app.jwt.secret=${JWT_SECRET}
# Token lifetime in seconds (86400 = 1 day). NOTE: .properties has no inline
# comments, so keep the value on its own line.
app.jwt.expiration-seconds=86400